compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation project(':core')
    implementation libs.logback.classic

    // test-fixtures of the locally published snapshot build (see test.dependsOn below), not a released version
    testImplementation "org.jobrunr:jobrunr:${project.version}:test-fixtures"
    testImplementation libs.gson

    testImplementation libs.assertj.core
    testImplementation libs.json.unit.assertj
    testImplementation libs.awaitility
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
}

test.dependsOn(':core:publishToMavenLocal')
test {
    reports.junitXml.outputLocation = file("/tmp/reports/$project.name")
    reports.html.outputLocation = file("/tmp/reports/$project.name")
}
