[plugins]
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexusPublish" }
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "benManesVersions" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }

spring-boot = { id = "org.springframework.boot", version.ref = "springBoot3" }
spring-boot4 = { id = "org.springframework.boot", version.ref = "springBoot4" }
