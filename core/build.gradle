plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'signing'
    id 'idea'
}

java {
    withJavadocJar()
    withSourcesJar()
}

sourceSets {
    main {
        resources {
            exclude '**/node_modules/'
            exclude '**/dependency-check-bin/'
            exclude '**/public/'
            exclude '**/src/'
            exclude '**/jsconfig.json'
            exclude '**/package.json'
            exclude '**/package-lock.json'
        }
    }
    java17 {
        java.srcDir 'src/main/java17'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    java25 {
        java.srcDir 'src/main/java25'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        java.srcDir 'src/test/java'
    }
    test17 {
        java.srcDir 'src/test/java17'
        compileClasspath += sourceSets.main.output + sourceSets.java17.output + configurations.test17CompileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.test.output + sourceSets.java17.output + configurations.test17RuntimeClasspath
    }
    test25 {
        java.srcDir 'src/test/java25'
        compileClasspath += sourceSets.main.output + sourceSets.java25.output + configurations.test25CompileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.test.output + sourceSets.java25.output + configurations.test25RuntimeClasspath
    }
}

configurations {
    java17Implementation.extendsFrom implementation
    java17CompileOnly.extendsFrom compileOnly
    java17RuntimeOnly.extendsFrom runtimeOnly
    test17Implementation.extendsFrom testImplementation, java17Implementation
    test17CompileOnly.extendsFrom testCompileOnly, java17CompileOnly
    test17RuntimeOnly.extendsFrom testRuntimeOnly, java17RuntimeOnly

    java25Implementation.extendsFrom implementation
    java25CompileOnly.extendsFrom compileOnly
    java25RuntimeOnly.extendsFrom runtimeOnly
    test25Implementation.extendsFrom testImplementation, java25Implementation
    test25CompileOnly.extendsFrom testCompileOnly, java25CompileOnly
    test25RuntimeOnly.extendsFrom testRuntimeOnly, java25RuntimeOnly
}

idea {
    module {
        testSources.from(sourceSets.test17.java.srcDirs)
        testSources.from(sourceSets.test25.java.srcDirs)
    }
}

tasks.named('compileJava', JavaCompile) {
    options.release = 8
}
tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}
tasks.named('compileTestFixturesJava', JavaCompile) {
    options.release = 17
}
tasks.named('compileJava17Java', JavaCompile) {
    options.release = 17
}
tasks.named('compileTest17Java', JavaCompile) {
    options.release = 17
}
tasks.named('compileJava25Java', JavaCompile) {
    options.release = 25
}
tasks.named('compileTest25Java', JavaCompile) {
    options.release = 25
}

tasks.register('test17', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test17.output.classesDirs
    classpath = sourceSets.test17.runtimeClasspath
}

tasks.register('test25', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test25.output.classesDirs
    classpath = sourceSets.test25.runtimeClasspath
}

tasks.named('check') {
    dependsOn 'test17', 'test25'
}

tasks.register('myJavadocs', Javadoc) {
    source = sourceSets.main.allJava
    classpath = project.sourceSets.main.compileClasspath
    options.links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
}

tasks.register('runFrontEndDevelopment', JavaExec) {
    group = "Execution"
    description = "Run the FrontEnd Development JavaExecTask"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.jobrunr.dashboard.FrontEndDevelopment'
}

dependencies {
    api libs.slf4j.api
    api libs.asm

    compileOnly libs.jackson.databind
    compileOnly libs.jackson.datatype.jsr310
    compileOnly libs.tools.jackson.databind
    compileOnly libs.gson
    compileOnly libs.yasson
    compileOnly libs.micrometer.core

    java17CompileOnly libs.tools.jackson.databind

    compileOnly libs.ojdbc8
    compileOnly libs.mongodb.driver.sync

    testImplementation libs.asm.util
    testImplementation libs.jackson.databind
    testImplementation libs.jackson.datatype.jsr310
    testImplementation libs.jackson.datatype.jdk8
    testImplementation libs.gson
    testImplementation libs.yasson
    testImplementation libs.micrometer.core
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.mariadb
    testImplementation libs.testcontainers.mssqlserver
    testImplementation libs.testcontainers.mysql
    testImplementation libs.testcontainers.oracle.free
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.db2
    testImplementation libs.testcontainers.mongodb
    testImplementation libs.sqlite.jdbc
    testImplementation libs.h2
    testImplementation libs.postgresql
    testImplementation libs.postgres.socket.factory
    testImplementation libs.mssql.jdbc
    testImplementation libs.jcc
    testImplementation libs.ojdbc8
    testImplementation libs.mariadb.java.client
    testImplementation libs.mysql.connector.j
    testImplementation libs.hikari.cp
    testImplementation libs.commons.dbcp2
    testImplementation libs.agroal.pool
    testImplementation libs.tomcat.jdbc
    testImplementation libs.mongodb.driver.sync
    testImplementation libs.wiremock
    test17Implementation libs.tools.jackson.databind

    testImplementation libs.awaitility
    testImplementation libs.assertj.core
    testImplementation libs.logback.classic
    testImplementation libs.mockito.junit.jupiter

    testFixturesApi libs.junit.jupiter
    testFixturesApi libs.mockito.core
    testFixturesApi libs.mockito.junit.jupiter
    testFixturesApi libs.assertj.core
    testFixturesApi libs.rerunner.jupiter
    testFixturesApi libs.awaitility
    testFixturesApi libs.json.unit.assertj
    testFixturesApi libs.logback.classic
    testFixturesApi libs.mongodb.driver.sync
    testFixturesApi libs.micrometer.core

    testFixturesCompileOnly libs.wiremock
}

tasks.withType(Test).configureEach {
    jvmArgs '--illegal-final-field-mutation=deny'
}

tasks.register('npmInstall', Exec) {
    workingDir = file('src/main/resources/org/jobrunr/dashboard/frontend')
    inputs.file('src/main/resources/org/jobrunr/dashboard/frontend/package.json')
    inputs.file('src/main/resources/org/jobrunr/dashboard/frontend/package-lock.json')
    outputs.dir('src/main/resources/org/jobrunr/dashboard/frontend/node_modules')

    environment 'NPM_CONFIG_REGISTRY', System.getenv('NPM_PROXY_URL') ?: 'https://registry.npmjs.org/'

    commandLine 'sh', '-c', 'npm ci --prefer-offline'
    outputs.cacheIf { false }
}

tasks.register('npmRunBuild', Exec) {
    dependsOn 'npmInstall'
    workingDir = file('src/main/resources/org/jobrunr/dashboard/frontend')
    inputs.files(
            fileTree('src/main/resources/org/jobrunr/dashboard/frontend') {
                exclude "node_modules/**"
                exclude "build/**"
            }
    ).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir('src/main/resources/org/jobrunr/dashboard/frontend/build')
    commandLine 'sh', '-c', 'npm run build'
    outputs.cacheIf { true }
}

tasks.register('npmRunTest', Exec) {
    dependsOn 'npmRunBuild'
    workingDir = file('src/main/resources/org/jobrunr/dashboard/frontend')
    inputs.files(
            fileTree('src/main/resources/org/jobrunr/dashboard/frontend') {
                exclude "node_modules/**"
                exclude "build/**"
            }
    ).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir('/tmp/reports/core/frontend')
    commandLine 'sh', '-c', 'npm run test'
    outputs.cacheIf { true }
}

// ⚠️These steps are essential for the frontend to be build and tested properly.
// Please don't remove, unless you've a different way to achieve the same thing.
// The steps make sure the tasks are included in the build and test pipeline of gradle.
npmRunTest.shouldRunAfter test
processResources.dependsOn npmRunBuild
sourcesJar.dependsOn npmRunBuild
check.dependsOn npmRunTest

jar {
    from(sourceSets.java17.output) {
        into 'META-INF/versions/17'
    }
    from(sourceSets.java25.output) {
        into 'META-INF/versions/25'
    }

    def asmVersion = configurations.compileClasspath.incoming.resolutionResult.allComponents.find {
        it.moduleVersion?.group == 'org.ow2.asm' && it.moduleVersion.name == 'asm'
    }?.moduleVersion?.version
    exclude('**/dependency-check-bin/', '**/dependency-check-reports/')
    manifest {
        attributes 'Automatic-Module-Name': 'org.jobrunr.core'
        attributes 'Multi-Release': 'true'
        attributes 'Built-By': 'ci.jobrunr.io'
        attributes 'Build-Timestamp': rootProject.getBuildTimestamp()
        attributes 'Build-Version': project.version
        attributes 'Implementation-Title': 'JobRunr'
        attributes 'Implementation-Version': project.version
        attributes 'Bundle-Version': project.version
        attributes 'Created-By': "Gradle ${gradle.gradleVersion}"
        attributes 'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})"
        attributes 'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
        attributes 'Minimum-ASM-Version': "${asmVersion}"
        attributes 'Git-Branch': rootProject.getGitBranch()
        attributes 'Git-Commit': rootProject.getGitCommit()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'org.jobrunr'
            artifactId = 'jobrunr'
            version = project.version
            from components.java

            pom {
                name = 'JobRunr'
                description = 'An easy way to perform background processing on the JVM. Backed by persistent storage. Open and free for commercial use.'
                url = 'https://github.com/jobrunr/jobrunr'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 or later'
                        url = 'https://github.com/jobrunr/jobrunr/blob/master/License.md#lgpl-v3-license'
                    }
                    license {
                        name = 'Commercial License'
                        url = 'https://github.com/jobrunr/jobrunr/blob/master/License.md#commercial-license'
                    }
                }
                developers {
                    developer {
                        id = 'rdehuyss'
                        name = 'Ronald Dehuysser'
                        email = 'ronald.dehuysser@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/jobrunr/jobrunr.git'
                    developerConnection = 'scm:git@github.com:jobrunr/jobrunr.git'
                    url = 'https://github.com/jobrunr/jobrunr.git'
                }

                versionMapping {
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                withXml {
                    def pomNode = asNode()
                    def dependencyManagement = pomNode.dependencyManagement
                    if (dependencyManagement) {
                        pomNode.remove(dependencyManagement)
                    }
                    pomNode.dependencies.'*'.findAll() {
                        it.optional.text() == 'true'
                    }.each() {
                        it.parent().remove(it)
                    }
                }
            }
        }
    }
}

signing {
    String base64Key = System.getenv('SIGNING_KEY')
    if (base64Key) {
        useInMemoryPgpKeys(new String(Base64.decoder.decode(base64Key)), System.getenv('SIGNING_PASSWORD'))
        sign publishing.publications.mavenJava
    }
}

// this task is executed on the release to check that the UI build output folder is present and fresh
tasks.register('uiBuildOutputVerification') {
    doLast {
        def outputDir = file('src/main/resources/org/jobrunr/dashboard/frontend/build')
        if (!outputDir.exists()) {
            throw new GradleException("UI build output missing! This means that the task 'npmRunBuild' hasn't run...")
        }

        def npmTask = tasks.named('npmRunBuild').get()
        def npmTaskHasRun = npmTask.state?.executed || npmTask?.state?.upToDate
        if (!npmTaskHasRun) {
            throw new GradleException("Task 'npmRunBuild' didn't run! Include it in your build.")
        }

        println "✓ UI build output validated"
    }
}