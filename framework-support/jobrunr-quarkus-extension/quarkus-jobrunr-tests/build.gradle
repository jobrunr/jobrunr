plugins {
    id 'java-library'
    alias(libs.plugins.quarkus.tests)
}

dependencies {
    api enforcedPlatform(libs.quarkus.tests.platform.bom)

    api project(':framework-support:jobrunr-quarkus-extension:quarkus-jobrunr')
    api project(':framework-support:jobrunr-quarkus-extension:quarkus-jobrunr-deployment')
    implementation 'io.quarkus:quarkus-core'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

    testImplementation testFixtures(project(":core"))
    testImplementation 'io.quarkus:quarkus-junit5'
}

java {
    withJavadocJar()
    withSourcesJar()
}

sonar {
    skipProject = true
}