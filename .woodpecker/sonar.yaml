when:
  - event: manual
  - event: cron
    cron: sonarqube

workspace:
  path: jobrunr/src

steps:
  - name: prepare-docker-build-container
    image: docker
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "Running on ${CI_SYSTEM_NAME:-<not set>}"
      - echo "$DOCKER_DHI_PASSWORD" | docker login dhi.io -u "$DOCKER_DHI_USERNAME" --password-stdin
      - docker build -f Dockerfile-build -t container-registry.jobrunr.io/build-container:latest .
    environment:
      DOCKER_DHI_USERNAME:
        from_secret: DOCKER_DHI_USERNAME
      DOCKER_DHI_PASSWORD:
        from_secret: DOCKER_DHI_PASSWORD

  - name: build-and-run-sonarqube-analysis
    image: container-registry.jobrunr.io/build-container:latest
    commands:
      - rm -rf /tmp/reports/*
      - find /woodpecker/jobrunr/src/.gradle -name "*.lock" -type f -delete
      - |
        bash -lc '
          set -e -o pipefail
          gradle --no-daemon -Djib.console=plain --info --continue clean build jacocoTestReport sonar -x :tests:e2e-ui:test \
            | grep -Ev "^(Found locally available resource with matching checksum|Build cache key for|BuildToolsApiClasspathEntrySnapshotTransform|ClasspathEntrySnapshotTransform|Resource missing\\.|Caching disabled for |[[:space:]]+Caching not enabled\\.)"
        '
    environment:
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      MAVEN_CENTRAL_PROXY_URL:
        from_secret: MAVEN_CENTRAL_PROXY_URL
      BUILD_CACHE_URL:
        from_secret: BUILD_CACHE_URL
      BUILD_CACHE_USER:
        from_secret: BUILD_CACHE_USER
      BUILD_CACHE_PASSWORD:
        from_secret: BUILD_CACHE_PASSWORD